name: Compress Upstream Source

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo to archive'
        required: false
        default: 'Familyye/AIDE-Plus-AS1'
      ref:
        description: 'Branch / tag / SHA to archive'
        required: false
        default: 'master'
      max_size_mb:
        description: 'Max allowed size per volume in MB (use 30 or 40)'
        required: false
        default: '30'
  push:
    paths:
      - '.github/workflows/source-archive.yml'

permissions:
  contents: read
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream_repo || 'Familyye/AIDE-Plus-AS1' }}
          ref: ${{ inputs.ref || 'master' }}
          path: upstream-src
          fetch-depth: 1
          submodules: false

      - name: Init submodules (tolerant, pinned rev may be gone)
        continue-on-error: true
        run: |
          cd upstream-src
          git submodule sync --recursive
          git submodule update --init --recursive || {
            echo "::warning::Pinned submodule rev missing, falling back to tip"
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read -r p; do
              echo "--- fallback: $p ---"
              git submodule update --init "$p" || true
              if [ -d "$p" ]; then
                (cd "$p" && git fetch origin --depth 1 origin/HEAD 2>/dev/null && git checkout FETCH_HEAD 2>/dev/null) || true
              fi
            done
            true
          }
          git submodule status --recursive || true

      - name: Report what is heavy
        run: |
          cd upstream-src
          echo "### Top-level sizes" >> $GITHUB_STEP_SUMMARY
          du -sh * .git 2>/dev/null | sort -rh | head -n 30 | tee -a $GITHUB_STEP_SUMMARY
          echo "### Largest files" >> $GITHUB_STEP_SUMMARY
          find . -path ./.git -prune -o -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -n 20 | awk '{printf "%.2f MB %s\n", $1/1024/1024, substr($0, index($0,$2))}' | tee -a $GITHUB_STEP_SUMMARY

      - name: Install 7z
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      # Full source is ~332 MiB (243 MiB even with lzma2 ultra) so a single
      # <30/40 MB file is impossible. Split into volumes, each under the limit.
      - name: Compress with 7z split volumes (each < max_size_mb)
        run: |
          MAX_MB="${{ inputs.max_size_mb || '30' }}"
          OUTDIR="${{ runner.temp }}/parts"
          mkdir -p "$OUTDIR"
          rm -f "$OUTDIR"/upstream-source.7z.*
          echo "OUTDIR=$OUTDIR" >> $GITHUB_ENV
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on -v${MAX_MB}m "$OUTDIR/upstream-source.7z" ./upstream-src \
            -xr!.git -xr!.gradle -xr!build -xr!.cxx -xr!.idea \
            -xr!local.properties -x!*.apk -x!*.aab -x!*.ap_
          ls -lh "$OUTDIR"
          echo "### Volumes (limit ${MAX_MB} MB each)" >> $GITHUB_STEP_SUMMARY
          ls -lh "$OUTDIR" | tee -a $GITHUB_STEP_SUMMARY

      - name: Size gate (every volume must be < max_size_mb)
        id: gate
        run: |
          MAX_MB="${{ inputs.max_size_mb || '30' }}"
          MAX_BYTES=$((MAX_MB * 1024 * 1024))
          FAIL=0
          for f in "$OUTDIR"/upstream-source.7z.*; do
            SZ=$(stat -c%s "$f")
            MB=$(awk "BEGIN {printf \"%.2f\", $SZ/1024/1024}")
            echo "$(basename $f): $MB MB ($SZ bytes)"
            if [ "$SZ" -gt "$MAX_BYTES" ]; then
              echo "::error::$(basename $f) $MB MB exceeds ${MAX_MB} MB"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "PASS: all volumes in valid range" >> $GITHUB_STEP_SUMMARY

      - name: Upload split archive (only if valid)
        if: steps.gate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source-split.7z
          path: ${{ runner.temp }}/parts/upstream-source.7z.*
          retention-days: 7
          compression-level: 0
