name: Compress Upstream Source

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repo to archive'
        required: false
        default: 'Familyye/AIDE-Plus-AS1'
      ref:
        description: 'Branch / tag / SHA to archive'
        required: false
        default: 'master'
      max_size_mb:
        description: 'Max allowed archive size in MB (use 30 or 40)'
        required: false
        default: '30'
  push:
    paths:
      - '.github/workflows/source-archive.yml'

permissions:
  contents: read
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.upstream_repo || 'Familyye/AIDE-Plus-AS1' }}
          ref: ${{ inputs.ref || 'master' }}
          path: upstream-src
          fetch-depth: 1
          submodules: false

      - name: Init submodules (tolerant, pinned rev may be gone)
        continue-on-error: true
        run: |
          cd upstream-src
          git submodule sync --recursive
          git submodule update --init --recursive || {
            echo "::warning::Pinned submodule rev missing, falling back to tip"
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read -r p; do
              echo "--- fallback: $p ---"
              git submodule update --init "$p" || true
              if [ -d "$p" ]; then
                (cd "$p" && git fetch origin --depth 1 origin/HEAD 2>/dev/null && git checkout FETCH_HEAD 2>/dev/null) || true
              fi
            done
            true
          }
          git submodule status --recursive || true

      - name: Report what is heavy
        run: |
          cd upstream-src
          echo "### Top-level sizes" >> $GITHUB_STEP_SUMMARY
          du -sh * 2>/dev/null | sort -rh | head -n 30 | tee -a $GITHUB_STEP_SUMMARY
          echo "### Largest files" >> $GITHUB_STEP_SUMMARY
          find . -path ./.git -prune -o -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -n 20 | awk '{printf "%.2f MB %s\n", $1/1024/1024, substr($0, index($0,$2))}' | tee -a $GITHUB_STEP_SUMMARY

      - name: Install 7z
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      # Submodule/ holds ~280 MB of binary blobs (kotlin-compiler jars,
      # android.jars, .so files, data.zip). Everything else is <2 MB, so
      # exclude re-fetchable binaries to land a single file under 30/40 MB.
      - name: Compress source with 7z (single file, no binaries)
        run: |
          ARCHIVE="${{ runner.temp }}/upstream-source.7z"
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV
          rm -f "$ARCHIVE"
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on "$ARCHIVE" ./upstream-src \
            -xr!.git -xr!.gradle -xr!build -xr!.cxx -xr!.idea \
            -xr!local.properties \
            -xr!*.jar -xr!*.aar -xr!*.so -xr!*.zip \
            -xr!*.apk -xr!*.aab -xr!*.ap_ -xr!*.dex -xr!*.odex
          ls -lh "$ARCHIVE"
          echo "### Archive (binaries excluded)" >> $GITHUB_STEP_SUMMARY
          ls -lh "$ARCHIVE" | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Excluded: .git, .gradle, build, .cxx, .idea, local.properties, *.jar, *.aar, *.so, *.zip, *.apk, *.aab, *.ap_, *.dex, *.odex" >> $GITHUB_STEP_SUMMARY

      - name: Size gate (must be < max_size_mb)
        id: gate
        run: |
          MAX_MB="${{ inputs.max_size_mb || '30' }}"
          SIZE_BYTES=$(stat -c%s "$ARCHIVE")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1024/1024}")
          MAX_BYTES=$((MAX_MB * 1024 * 1024))
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "### Size check: ${SIZE_MB} MB / limit ${MAX_MB} MB" >> $GITHUB_STEP_SUMMARY
          if [ "$SIZE_BYTES" -le "$MAX_BYTES" ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "PASS: size in valid range" >> $GITHUB_STEP_SUMMARY
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "FAIL: ${SIZE_MB} MB exceeds ${MAX_MB} MB limit" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload artifact (only if valid)
        if: steps.gate.outputs.valid == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-source.7z
          path: ${{ runner.temp }}/upstream-source.7z
          retention-days: 7
          compression-level: 0
